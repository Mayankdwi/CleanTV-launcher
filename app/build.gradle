plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleanyourtv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.cleanyourtv.launcher"
        minSdk 22
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
